[package]
name = "termish-agent"
version = "0.9.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
