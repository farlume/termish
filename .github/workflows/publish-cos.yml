name: Publish Release to COS

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.7.1；留空同步最新正式版"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-cos
  cancel-in-progress: false

jobs:
  upload:
    name: Upload release files and version metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cos-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/cos-requirements.txt
      - name: Install COS SDK
        run: python -m pip install -r scripts/cos-requirements.txt
      - name: Upload published release to COS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_PREFIX: ${{ vars.COS_PREFIX || 'downloads' }}
          COS_PUBLIC_BASE_URL: ${{ vars.COS_PUBLIC_BASE_URL }}
        run: python scripts/publish_cos.py --tag "$RELEASE_TAG"
