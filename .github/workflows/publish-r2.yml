name: Publish Release to R2

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.7.1；留空同步最新正式版"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-r2
  cancel-in-progress: false

jobs:
  upload:
    name: Upload release files and version metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upload release to R2 and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || 'downloads' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: node scripts/publish-r2.mjs --tag "$RELEASE_TAG"
