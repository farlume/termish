name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tools:
    name: Release tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v

  # ---------------------------------------------------------------------------
  # Android：单测 + lint 始终跑；debug/release 产物全部上传 artifact 留档
  #（PR 只跑检查，不打包省额度）
  #
  # release 签名是可选的：仓库配置好下面 4 个 Secrets 后自动签名，
  # 未配置时产出未签名 APK/AAB（仅用于自测）。
  #   ANDROID_KEYSTORE_BASE64       – 签名密钥库的 base64 内容
  #   ANDROID_KEYSTORE_PASSWORD     – 密钥库密码
  #   ANDROID_KEY_ALIAS             – 别名
  #   ANDROID_KEY_PASSWORD          – 别名密码
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 发版 tag 必须与仓库里的版本号一致，防止「tag 0.3.0、包还是 0.2.0」
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          IOS_VERSIONS=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);.*/\1/p' iosApp/iosApp.xcodeproj/project.pbxproj | sort -u)
          if [ "$TAG" != "$VN" ] || [ "$TAG" != "$IOS_VERSIONS" ]; then
            echo "::error::tag=$TAG 与构建配置不一致 (Android versionName=$VN, iOS MARKETING_VERSION=$IOS_VERSIONS)"
            echo "::error::请先运行 ./scripts/bump-version.sh $TAG 并提交，再重新打 tag"
            exit 1
          fi
          echo "版本一致：Android / iOS $TAG"

      # 正式 tag 绝不允许降级为 unsigned 产物；普通 main 构建仍可生成未签名
      # release artifact 供内部检查，但不会进入 GitHub Release。
      - name: Verify release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew checkSigningSecrets

      - name: Prepare SSH integration tests
        # sshd 以 runner 用户启动；Ubuntu 特权分离目录需预先创建。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server netcat-openbsd
          sudo mkdir -p /run/sshd

      # 检查先行：单测失败即停，不产出包
      - name: Run checks (unit + integration tests + lint)
        run: |
          ./gradlew \
            agentBridgeTest \
            ktlintCheck \
            testIntegration \
            :composeApp:lintRelease

      - name: Build debug APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:assembleDebug

      # release 签名：secrets 以环境变量注入，build.gradle.kts 直接读取并解码 base64，
      # 云端零文件落地（本地则走 secrets/.env，见 signingConfigs 注释）
      - name: Build release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Verify release artifact signatures
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=$(find composeApp/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          AAB=$(find composeApp/build/outputs/bundle/release -type f -name '*.aab' -print -quit)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APK" && test -n "$AAB" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # AAB 验签：jarsigner -strict 在新 JDK 上把自签名证书链的 PKIX 警告
          # 当失败（exit 4，v1.6.4 首跑即被拦）——release keystore 本就是自签名，
          # 这是预期；而「未签名」的 jar 无论 strict 与否都返回 0。改为：
          # ① 断言签名条目存在（META-INF/*.{RSA,DSA,EC} + *.SF 只会由签名产生）
          # ② jarsigner 输出含 verified（未签名/被篡改时输出 unsigned/error）
          unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)$' \
            && unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.SF$' \
            || { echo "::error::AAB 缺少签名条目（未签名产物不得发版）"; exit 1; }
          jarsigner -verify "$AAB" | grep -q "jar verified" \
            || { echo "::error::AAB jarsigner 校验未通过（被篡改/损坏？）"; exit 1; }

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename release assets with build stamp
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        # 测试包不改 versionName/versionCode（同号覆盖安装允许，正式发版不受
        # run_number 膨胀影响）；文件名带 run 号 + 短 SHA，下载后可溯源是
        # 哪次构建。tag 发版不改名：release job 的重命名步骤依赖原始文件名
        run: |
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          cd composeApp/build/outputs
          STAMP="${VN}-rc${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          for f in apk/release/*.apk bundle/release/*.aab; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/^composeApp-//')
            mv "$f" "$(dirname "$f")/Termish-$STAMP-$name"
          done
          ls apk/release bundle/release

      - name: Upload release APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag（vX.Y.Z）触发，汇总 Android 产物创建 GitHub Release（iOS 由 Xcode Cloud 分发）
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, release-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 上下文，必须 checkout
      - uses: actions/checkout@v4

      # 只取 Android release 产物（debug APK 仅留档，不进 Release）。
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
          merge-multiple: true

      - name: Rename assets with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          # upload-artifact v4 多 path 会保留 apk/、bundle/ 目录结构。
          # 收集 APK/AAB 并按版本统一重命名到顶层。
          while IFS= read -r -d '' f; do
            name=$(basename "$f" | sed "s/^composeApp-//")
            mv "$f" "Termish-$VER-$name"
          done < <(find . -type f \( -name "*.apk" -o -name "*.aab" \) -print0)
          rm -rf apk bundle
          ls -l

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          # 上次失败可能留下同名 release（资产不完整）：删掉重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          # 先建空 release，资产逐个 --clobber 上传：gh release create 带资产
          # 不支持覆盖同名资产（delete 后立即重建同名资产会遇 uploads 服务
          # 去重延迟 → 422 ReleaseAsset.name already exists），逐资产上传
          # 幂等且单资产失败可单独补传
          gh release create "$TAG" --title "$TAG" --generate-notes
          for f in dist/*; do
            gh release upload "$TAG" "$f" --clobber
            echo "✅ 已上传 $(basename "$f")"
          done
          echo "✅ Release $TAG 完成"

  publish-cos:
    name: Sync published release to COS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-cos.yml
    with:
      tag: ${{ github.ref_name }}
