name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Android：单测 + lint 始终跑；release APK + AAB 只在非 PR 触发时打包
  #
  # release 签名是可选的：仓库配置好下面 4 个 Secrets 后自动签名，
  # 未配置时产出未签名 APK/AAB（仅用于自测）。
  #   ANDROID_KEYSTORE_BASE64       – 签名密钥库的 base64 内容
  #   ANDROID_KEYSTORE_PASSWORD     – 密钥库密码
  #   ANDROID_KEY_ALIAS             – 别名
  #   ANDROID_KEY_PASSWORD          – 别名密码
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # storeFile 在 composeApp/build.gradle.kts 里相对模块目录解析
          printf '%s' "$KEYSTORE_B64" | base64 -d > composeApp/android-release.jks
          printf 'storeFile=android-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      # 发版 tag 必须与仓库里的版本号一致，防止「tag 0.3.0、包还是 0.2.0」
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          PV=$(sed -n 's/^[[:space:]]*packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          # 桌面 jpackage 要求主版本号 > 0：App 0.Y.Z 对应桌面包 1.Y.Z
          if [[ "$TAG" =~ ^0\.([0-9]+\.[0-9]+)$ ]]; then
            PV_EXPECTED="1.${BASH_REMATCH[1]}"
          else
            PV_EXPECTED="$TAG"
          fi
          if [ "$TAG" != "$VN" ] || [ "$PV" != "$PV_EXPECTED" ]; then
            echo "::error::tag=$TAG 与构建配置不一致 (Android versionName=$VN, 桌面 packageVersion=$PV)"
            echo "::error::请先运行 ./scripts/bump-version.sh $TAG 并提交（桌面包版本应为 $PV_EXPECTED），再重新打 tag"
            exit 1
          fi
          echo "版本一致：$TAG（桌面包 $PV）"

      # 检查先行：单测失败即停，不产出包
      - name: Run checks (unit tests + lint)
        run: |
          ./gradlew \
            :composeApp:testDebugUnitTest \
            :composeApp:lintRelease

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Build release APK and AAB
        if: github.event_name != 'pull_request'
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面端：DMG (macOS) / DEB (Linux) / MSI (Windows)，三平台并行打包；
  # PR 只跑 Linux 单测，不打包
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.platform }})
    # PR 只需 Linux 单测；macOS/Windows 打包仅在 main/tag/手动触发
    if: github.event_name != 'pull_request' || matrix.platform == 'Linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            task: packageDmg
            artifact_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - platform: Linux
            os: ubuntu-latest
            task: packageDeb
            artifact_path: composeApp/build/compose/binaries/main/deb/*.deb
          - platform: Windows
            os: windows-latest
            task: packageMsi
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage 打 MSI 需要 WiX Toolset，GitHub Windows runner 未预装
      - name: Install WiX Toolset
        if: matrix.platform == 'Windows'
        run: choco install wixtoolset --yes --no-progress

      # 测试在 Linux 上跑一次即可（commonTest 与 JVM 逻辑跨平台一致），
      # 失败则本平台不打包。集成测试需要本地 sshd + mosh，
      # 所以先安装并启动测试 sshd，再以 MSSH_TEST_RUN=1 跑（否则测试会 SKIP 空跑）
      - name: Install sshd + mosh for integration tests
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server mosh netcat-openbsd

      - name: Start test sshd
        if: matrix.platform == 'Linux'
        run: sudo bash scripts/test-sshd.sh

      - name: Run desktop tests
        if: matrix.platform == 'Linux'
        run: MSSH_TEST_RUN=1 ./gradlew :composeApp:desktopTest

      - name: Package (${{ matrix.platform }})
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag（vX.Y.Z）触发，汇总 Android + 桌面产物创建 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename Android assets with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          for f in composeApp-*.apk composeApp-*.aab; do
            [ -e "$f" ] || continue
            mv "$f" "MSSH-$VER-${f#composeApp-}"
          done
          ls -l

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
