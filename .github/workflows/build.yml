name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Android：debug/release APK + Play 商店 AAB
  #
  # release 签名是可选的：仓库配置好下面 4 个 Secrets 后自动签名，
  # 未配置时产出未签名 APK/AAB（仅用于自测）。
  #   ANDROID_KEYSTORE_BASE64       – 签名密钥库的 base64 内容
  #   ANDROID_KEYSTORE_PASSWORD     – 密钥库密码
  #   ANDROID_KEY_ALIAS             – 别名
  #   ANDROID_KEY_PASSWORD          – 别名密码
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # storeFile 在 composeApp/build.gradle.kts 里相对模块目录解析
          printf '%s' "$KEYSTORE_B64" | base64 -d > composeApp/android-release.jks
          printf 'storeFile=android-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      # 检查先行：单测失败即停，不产出包
      - name: Run checks (unit tests + lint)
        run: |
          ./gradlew \
            :composeApp:testDebugUnitTest \
            :composeApp:lintDebug

      - name: Build APKs and AAB
        run: |
          ./gradlew \
            :composeApp:assembleDebug \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面端：DMG (macOS) / DEB (Linux) / MSI (Windows)，三平台并行打包
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            task: packageDmg
            artifact_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - platform: Linux
            os: ubuntu-latest
            task: packageDeb
            artifact_path: composeApp/build/compose/binaries/main/deb/*.deb
          - platform: Windows
            os: windows-latest
            task: packageMsi
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage 打 MSI 需要 WiX Toolset，GitHub Windows runner 未预装
      - name: Install WiX Toolset
        if: matrix.platform == 'Windows'
        run: choco install wixtoolset --yes --no-progress

      # 测试在 Linux 上跑一次即可（commonTest 与 JVM 逻辑跨平台一致），
      # 失败则本平台不打包
      - name: Run desktop tests
        if: matrix.platform == 'Linux'
        run: ./gradlew :composeApp:desktopTest

      - name: Package (${{ matrix.platform }})
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
