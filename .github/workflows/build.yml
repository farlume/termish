name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Android：单测 + lint 始终跑；debug/release 产物全部上传 artifact 留档
  #（PR 只跑检查，不打包省额度）
  #
  # release 签名是可选的：仓库配置好下面 4 个 Secrets 后自动签名，
  # 未配置时产出未签名 APK/AAB（仅用于自测）。
  #   ANDROID_KEYSTORE_BASE64       – 签名密钥库的 base64 内容
  #   ANDROID_KEYSTORE_PASSWORD     – 密钥库密码
  #   ANDROID_KEY_ALIAS             – 别名
  #   ANDROID_KEY_PASSWORD          – 别名密码
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 发版 tag 必须与仓库里的版本号一致，防止「tag 0.3.0、包还是 0.2.0」
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          PV=$(sed -n 's/^[[:space:]]*packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          # 桌面 jpackage 要求主版本号 > 0：App 0.Y.Z 对应桌面包 1.Y.Z
          if [[ "$TAG" =~ ^0\.([0-9]+\.[0-9]+)$ ]]; then
            PV_EXPECTED="1.${BASH_REMATCH[1]}"
          else
            PV_EXPECTED="$TAG"
          fi
          if [ "$TAG" != "$VN" ] || [ "$PV" != "$PV_EXPECTED" ]; then
            echo "::error::tag=$TAG 与构建配置不一致 (Android versionName=$VN, 桌面 packageVersion=$PV)"
            echo "::error::请先运行 ./scripts/bump-version.sh $TAG 并提交（桌面包版本应为 $PV_EXPECTED），再重新打 tag"
            exit 1
          fi
          echo "版本一致：$TAG（桌面包 $PV）"

      # 检查先行：单测失败即停，不产出包
      - name: Run checks (unit tests + lint)
        run: |
          ./gradlew \
            :composeApp:testDebugUnitTest \
            :composeApp:lintRelease

      - name: Build debug APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:assembleDebug

      # release 签名：secrets 以环境变量注入，build.gradle.kts 直接读取并解码 base64，
      # 云端零文件落地（本地则走 secrets/.env，见 signingConfigs 注释）
      - name: Build release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK and AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面（Linux）：单测 + 集成测试（自启动测试 sshd）+ DEB 打包；
  # PR 只跑测试不打包。macOS/Windows 打包在 desktop-extra（仅 tag 发版时跑，
  # macOS 计费 10x 分钟，日常 main push 不烧额度）
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # openssh-server/netcat-openbsd：desktopTest 集成测试自启动 sshd(22222)
      # binutils(objcopy)：jlink 生成运行时镜像时剥离原生库调试符号，
      #   最小化 Debian 不自带，缺失会报 "Cannot run program objcopy" 导致 createRuntimeImage 失败
      - name: Install sshd + binutils for tests/package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server netcat-openbsd binutils

      - name: Start test sshd
        # Ubuntu 需要特权分离目录 /run/sshd（root 创建一次）；
        # sshd 必须以非 root 运行：root sshd 会拒绝锁定账号（GitHub runner
        # 用户无密码被锁），且 root 属主的 authorized_keys 对非 root 认证
        # 用户不可见——本地 macOS 也是非 root 跑，行为一致
        run: |
          sudo mkdir -p /run/sshd
          bash scripts/test-sshd.sh

      - name: Run desktop tests
        # 集成测试按 sshd(22222) 可用性自我探测，无需 TERMISH_TEST_RUN
        run: ./gradlew :composeApp:desktopTest

      - name: Package (Linux)
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:packageDeb

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面（macOS/Windows）：仅 tag 发版时打包 DMG/MSI（10x/2x 计费，不日常跑）；
  # 单测已由 Linux job 覆盖（commonTest 与 JVM 逻辑跨平台一致），这里只打包
  # ---------------------------------------------------------------------------
  desktop-extra:
    name: Desktop (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
            task: packageDmg
            artifact_path: composeApp/build/compose/binaries/main/dmg/*.dmg
          - platform: Windows
            os: windows-latest
            task: packageMsi
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Package (${{ matrix.platform }})
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag（vX.Y.Z）触发，汇总 Android + 桌面产物创建 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop, desktop-extra]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 上下文，必须 checkout
      - uses: actions/checkout@v4

      # 只取签名 release 产物与桌面包（debug APK 仅留档，不进 Release）
      - uses: actions/download-artifact@v4
        with:
          pattern: |
            android-release
            desktop-*
          path: dist
          merge-multiple: true

      - name: Rename assets with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd dist
          # upload-artifact v4 多 path 会保留目录结构（apk/、bundle/、deb/），
          # 递归收集 apk/aab/deb 统一重命名到顶层；jpackage 的 deb 名含构建号，
          # 统一为 Termish-<ver>-linux-amd64.deb
          for f in $(find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.deb" \)); do
            ext="${f##*.}"
            if [ "$ext" = "deb" ]; then
              mv "$f" "Termish-$VER-linux-amd64.deb"
            else
              name=$(basename "$f" | sed "s/^composeApp-//")
              mv "$f" "Termish-$VER-$name"
            fi
          done
          # DMG/MSI 由 jpackage 命名（自带版本号）且单文件上传后已在顶层，原样保留
          rm -rf apk bundle deb
          ls -l

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          # 上次失败可能留下同名 release（资产不完整）：删掉重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          # 先建空 release，资产逐个 --clobber 上传：gh release create 带资产
          # 不支持覆盖同名资产（delete 后立即重建同名资产会遇 uploads 服务
          # 去重延迟 → 422 ReleaseAsset.name already exists），逐资产上传
          # 幂等且单资产失败可单独补传
          gh release create "$TAG" --title "$TAG" --generate-notes
          for f in dist/*; do
            gh release upload "$TAG" "$f" --clobber
            echo "✅ 已上传 $(basename "$f")"
          done
          echo "✅ Release $TAG 完成"
