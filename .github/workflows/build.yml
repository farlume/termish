name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # 注意：公开仓库 + self-hosted runner = RCE 风险（PR 可提交任意代码到 NAS 执行），
  # 故开源后禁用 pull_request 触发；如需 PR CI，改用 GitHub hosted runner 再恢复
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Android：单测 + lint 始终跑；release APK + AAB 只在非 PR 触发时打包
  #
  # release 签名是可选的：仓库配置好下面 4 个 Secrets 后自动签名，
  # 未配置时产出未签名 APK/AAB（仅用于自测）。
  #   ANDROID_KEYSTORE_BASE64       – 签名密钥库的 base64 内容
  #   ANDROID_KEYSTORE_PASSWORD     – 密钥库密码
  #   ANDROID_KEY_ALIAS             – 别名
  #   ANDROID_KEY_PASSWORD          – 别名密码
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    # Android 构建跑自托管 runner（NAS）：GitHub hosted 分钟数额度已耗尽
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # self-hosted（NAS）已预装 JDK17（.env 的 JAVA_HOME），跳过下载避免网络超时
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 发版 tag 必须与仓库里的版本号一致，防止「tag 0.3.0、包还是 0.2.0」
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          PV=$(sed -n 's/^[[:space:]]*packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          # 桌面 jpackage 要求主版本号 > 0：App 0.Y.Z 对应桌面包 1.Y.Z
          if [[ "$TAG" =~ ^0\.([0-9]+\.[0-9]+)$ ]]; then
            PV_EXPECTED="1.${BASH_REMATCH[1]}"
          else
            PV_EXPECTED="$TAG"
          fi
          if [ "$TAG" != "$VN" ] || [ "$PV" != "$PV_EXPECTED" ]; then
            echo "::error::tag=$TAG 与构建配置不一致 (Android versionName=$VN, 桌面 packageVersion=$PV)"
            echo "::error::请先运行 ./scripts/bump-version.sh $TAG 并提交（桌面包版本应为 $PV_EXPECTED），再重新打 tag"
            exit 1
          fi
          echo "版本一致：$TAG（桌面包 $PV）"

      # 检查先行：单测失败即停，不产出包
      - name: Run checks (unit tests + lint)
        run: |
          ./gradlew \
            :composeApp:testDebugUnitTest \
            :composeApp:lintRelease

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      # release 签名：secrets 以环境变量注入，build.gradle.kts 直接读取并解码 base64，
      # 云端零文件落地（本地则走 secrets/.env，见 signingConfigs 注释）
      - name: Build release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK and AAB
        if: github.event_name != 'pull_request'
        # NAS 出口网络对大文件上传不稳（ECONNRESET）：构建照跑验证签名配置，
        # 上传失败不阻塞 workflow（产物仍在 NAS 本地 build/ 目录，可手动取）。
        # 网络修复后删掉 continue-on-error 恢复严格上传。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 桌面端：DMG (macOS) / DEB (Linux) / MSI (Windows)，三平台并行打包；
  # PR 只跑 Linux 单测，不打包
  #
  # 暂时禁用（if: false）：NAS 自托管 runner 上传大产物（.deb/release APK）
  # 时 ECONNRESET（出口网络对长连接不稳），Android 小产物 debug 可传。
  # NAS 网络修复后恢复；恢复时把 if: false 删掉即可（matrix 配置保留）。
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.platform }})
    if: false
    # 注意：job 级 if 不可用 matrix context（GitHub 限制）
    # macOS/Windows 暂从 matrix 移除：hosted 额度被暂停（账单问题），
    # NAS 只能打 Linux 包；账单恢复后加回（见 git 历史中的原配置）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            # Linux 桌面包跑自托管 runner（NAS）：hosted 额度已耗尽
            runner: [self-hosted, Linux, X64]
            task: packageDeb
            artifact_path: composeApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # self-hosted（NAS）已预装 JDK17，跳过下载避免网络超时
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 测试在 Linux 上跑一次即可（commonTest 与 JVM 逻辑跨平台一致），
      # 失败则本平台不打包。集成测试需要本地 sshd：
      # 先安装并启动测试 sshd，desktopTest 会按 22222 端口可用性自动跑或 SKIP
      - name: Install sshd + binutils for tests/package
        if: matrix.platform == 'Linux'
        # openssh-server/netcat-openbsd：desktopTest 集成测试自启动 sshd(22222)
        # binutils(objcopy)：jlink 生成运行时镜像时剥离原生库调试符号，
        #   最小化 Debian 不自带，缺失会报 "Cannot run program objcopy" 导致 createRuntimeImage 失败
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server netcat-openbsd binutils

      - name: Start test sshd
        if: matrix.platform == 'Linux'
        # Ubuntu 需要特权分离目录 /run/sshd（root 创建一次）；
        # sshd 必须以非 root 运行：root sshd 会拒绝锁定账号（GitHub runner
        # 用户无密码被锁），且 root 属主的 authorized_keys 对非 root 认证
        # 用户不可见——本地 macOS 也是非 root 跑，行为一致
        run: |
          sudo mkdir -p /run/sshd
          bash scripts/test-sshd.sh

      - name: Run desktop tests
        if: matrix.platform == 'Linux'
        # 集成测试按 sshd(22222) 可用性自我探测，无需 TERMISH_TEST_RUN
        run: ./gradlew :composeApp:desktopTest

      - name: Package (${{ matrix.platform }})
        if: github.event_name != 'pull_request'
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅 tag（vX.Y.Z）触发。独立构建（不依赖 android/desktop 的 artifact
  # 上传下载——NAS 出口网络上传大文件 ECONNRESET，绕开 blob storage 通道）。
  # Release 资产上传加重试（5 次指数退避），仍是偶发重置可恢复；
  # 持续失败时产物留在 NAS 本地 build/ 目录，可手动发布。
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes 需要 git 上下文，必须 checkout
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          if [ "$TAG" != "$VN" ]; then
            echo "::error::tag=$TAG 与 Android versionName=$VN 不一致，先运行 ./scripts/bump-version.sh $TAG"
            exit 1
          fi
          echo "版本一致：$TAG"

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :composeApp:assembleRelease \
            :composeApp:bundleRelease

      - name: Collect and checksum artifacts
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for f in composeApp/build/outputs/apk/release/*.apk composeApp/build/outputs/bundle/release/*.aab; do
            name=$(basename "$f" | sed "s/^composeApp-//")
            cp "$f" "dist/Termish-$VER-$name"
          done
          cd dist
          shasum -a 256 * > SHA256SUMS
          ls -l

      - name: Create GitHub Release (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 上次失败可能留下同名 release（资产不完整）：删掉重建
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          for i in 1 2 3 4 5; do
            if gh release create "$GITHUB_REF_NAME" $(find dist -type f) \
                --title "$GITHUB_REF_NAME" --generate-notes 2>/tmp/gh-rel.err; then
              echo "✅ Release $GITHUB_REF_NAME 创建成功（尝试 $i）"
              exit 0
            fi
            echo "⚠️ 第 $i 次创建失败（ECONNRESET 类网络抖动常见），$((i*15))s 后重试…"
            cat /tmp/gh-rel.err | tail -3
            sleep $((i*15))
          done
          echo "::error::Release 创建 5 次均失败；产物在 NAS 本地 dist/ 目录，可手动 gh release create"
          exit 1
