name: iOS Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "composeApp/**"
      - "iosApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "scripts/build-ios-native.sh"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  framework:
    name: iOS frameworks
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache OpenSSL and libssh2
        id: native-cache
        uses: actions/cache@v4
        with:
          path: iosApp/native
          key: ios-native-${{ runner.os }}-${{ hashFiles('scripts/build-ios-native.sh', 'composeApp/src/nativeInterop/cinterop/**') }}

      - name: Build native transport libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: make ios-native

      - name: Compile simulator and device frameworks
        run: make ios-framework
